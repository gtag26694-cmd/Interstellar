[build]
  # Install with the pinned pnpm via npx when dependencies are missing (pnpm may not be on PATH),
  # then run the build script directly with Node and emit the static routing rules.
  command = "([ -d node_modules ] || npx -y pnpm@10.33.0 install --frozen-lockfile) && node src/build.js && node scripts/netlify-redirects.js"
  publish = "dist"

[build.environment]
  # Netlify can't host the Wisp WebSocket server, so proxied traffic goes through a public instance.
  WISP_URL = "wss://wisp.mercurywork.shop/"
